# CI: format, lint, and test every push to the long-lived branches and every
# pull request. Mirrors the local `make check` gate (clippy -D warnings +
# cargo test) so a green local run means a green CI run.
name: CI

on:
  push:
    branches: [main, integration-main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Wrap each macOS tarball in a drag-and-drop .dmg. cargo-dist 0.32 doesn't
  # generate dmg natively, so this job runs on a macOS runner and uses
  # `create-dmg` (https://github.com/create-dmg/create-dmg).
  build-mac-dmg:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Fetch macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: downloaded
      - name: Extract tarball
        run: |
          set -euo pipefail
          cd downloaded
          tar -xJf "planebotcli-cli-${{ matrix.target }}.tar.xz"
      - name: Stage dmg payload
        run: |
          set -euo pipefail
          # github.ref_name is set by whoever pushed the tag/branch — guard
          # against shell metacharacters before splicing it into a heredoc.
          if ! [[ "${VERSION}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "VERSION ('${VERSION}') contains characters outside [A-Za-z0-9._/-]; refusing to interpolate it into a heredoc."
            exit 1
          fi
          mkdir -p dmg-payload
          mv "downloaded/planebotcli-cli-${{ matrix.target }}/planebotcli" dmg-payload/planebotcli
          mv "downloaded/planebotcli-cli-${{ matrix.target }}/pbot" dmg-payload/pbot
          cat > dmg-payload/INSTALL.txt <<EOF
          planebotcli + pbot
          ================

          Drag 'planebotcli' and 'pbot' to a directory on your \$PATH.
          Common choices (any of these is fine):

              ~/bin                  # user-local, no sudo needed
              /usr/local/bin         # system-wide, may need sudo on newer macOS
              /opt/homebrew/bin      # Homebrew on Apple Silicon

          Verify with:
              \$ planebotcli --version
              planebotcli ${VERSION}

          Or use the shell installer instead:
              curl --proto '=https' --tlsv1.2 -LsSf https://github.com/Liewzheng/planebotcli/releases/latest/download/planebotcli-installer.sh | sh

          Documentation: https://github.com/Liewzheng/planebotcli
          EOF
      - name: Install create-dmg
        # Homebrew formulae don't support @version pinning, so this pulls
        # the current stable (formulae.brew.sh lists 1.3.0 at the time
        # of writing). If the major version ever moves, the dmg layout
        # may change and the next release run will catch it.
        run: brew install --quiet create-dmg
      - name: Build dmg
        run: |
          set -euo pipefail
          create-dmg \
            --volname "planebotcli ${VERSION}" \
            --window-pos 200 120 \
            --window-size 600 320 \
            --icon-size 80 \
            --icon planebotcli 150 100 \
            --hide-extension planebotcli \
            --icon pbot 150 200 \
            --hide-extension pbot \
            --icon INSTALL.txt 150 280 \
            "planebotcli-${{ matrix.target }}.dmg" \
            dmg-payload/
      - name: Upload dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-dmg-${{ matrix.target }}
          path: planebotcli-${{ matrix.target }}.dmg

  # Build the Windows MSI installer via cargo-wix (cargo-dist 0.32's
  # WiX-key detection does not pick up the GUIDs in planebotcli-cli's
  # Cargo.toml under our workspace layout; running cargo-wix directly
  # sidesteps that). The .msi lands on the GitHub release alongside
  # cargo-dist's other installers.
  build-windows-msi:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry + build target
        # Cache the registry + the x86_64-pc-windows-msvc build target so
        # the `cargo build --release --target …` below skips several minutes
        # of incremental recompiles on cache hits.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: planebotcli-cli -> target
      - name: Cache cargo-wix
        # Pin the cargo-wix version so a future breaking change on
        # crates.io can't silently break the release pipeline. Cache the
        # installed binary by version + runner OS so subsequent runs skip
        # the from-source compile (which is several minutes on windows-latest).
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-0.3.9-windows-${{ runner.os }}
      - name: Install cargo-wix
        # Pinned to 0.3.9 (latest stable on crates.io). If this version is
        # ever yanked, fail loudly rather than silently fall back to a
        # newer version with potential breaking changes.
        # `shell: bash` is required because the default shell on
        # windows-latest is PowerShell, which doesn't parse `if [ … ]`.
        shell: bash
        run: |
          if [ ! -x ~/.cargo/bin/cargo-wix.exe ]; then
            cargo install cargo-wix --version 0.3.9 --locked
          fi
      - name: Build planebotcli-cli (x86_64-pc-windows-msvc, release)
        # cargo-wix 0.3.9 expects the binary at
        # `target/x86_64-pc-windows-msvc/release/planebotcli.exe`
        # (path encoded in `wix/main.wxs`). `--locked` pins the dep graph
        # from Cargo.lock so the build is reproducible. We build from
        # source here rather than pulling from cargo-dist's tarball —
        # that keeps the path layout predictable across platforms.
        shell: bash
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --locked \
            --package planebotcli-cli --bin planebotcli
      - name: Verify binary exists
        # cargo-wix exits non-zero with a generic error if the binary
        # path it expects is missing — fail loudly here so the next step
        # shows a clear cause rather than the cargo-wix error.
        shell: bash
        run: |
          if [ ! -f target/x86_64-pc-windows-msvc/release/planebotcli.exe ]; then
            echo "::error::expected binary not found at target/x86_64-pc-windows-msvc/release/planebotcli.exe"
            exit 1
          fi
      - name: Generate MSI
        # cargo-wix shells out to candle.exe / light.exe (WiX v3 toolset) to
        # build the .msi. The output goes to cargo-wix 0.3.9's default
        # `target/wix/<name>.msi` (verified against the embedded template
        # at `cargo-wix-0.3.9/src/create.rs` line 1985; we previously
        # passed `--output msi` which placed the file under `msi/` and
        # then our verify step looked under `target/wix/` — that mismatch
        # silently produced no upload).
        shell: bash
        run: |
          cargo wix --package planebotcli-cli --nocapture
      - name: Verify MSI was produced
        # cargo-wix exits 0 even when its output path is empty / different
        # from the expected glob (e.g. after a future flag change). Fail
        # loudly here rather than uploading nothing in the next step.
        shell: bash
        run: |
          if [ -z "$(ls target/wix/*.msi 2>/dev/null)" ]; then
            echo "::error::cargo wix produced no .msi file under target/wix/"
            exit 1
          fi
          ls -la target/wix/
      - name: Upload msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-msi-windows
          path: target/wix/*.msi
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - build-mac-dmg
      - build-windows-msi
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && (needs.build-mac-dmg.result == 'skipped' || needs.build-mac-dmg.result == 'success') && (needs.build-windows-msi.result == 'skipped' || needs.build-windows-msi.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

[package]
name = "planebotcli-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "planebotcli"
path = "src/main.rs"

[[bin]]
name = "pbot"
path = "src/bin/pbot.rs"

# WiX GUIDs for the `msi` installer (cargo-dist 0.32 plan step).
# upgrade_guid identifies the product upgrade family across versions;
# path_guid identifies the install path. Both are project-scoped.
[package.metadata.wix]
upgrade_guid = "AE278A83-4BC4-453C-B730-9BB62BE087EA"
path_guid = "A7B828B6-7B47-4769-9CD8-E42C1003CF78"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
planebotcli-cache = { path = "../planebotcli-cache" }
planebotcli-client = { path = "../planebotcli-client" }
planebotcli-core = { path = "../planebotcli-core" }
planebotcli-format = { path = "../planebotcli-format" }
planebotcli-html = { path = "../planebotcli-html" }
planebotcli-resolve = { path = "../planebotcli-resolve" }
planebotcli-types = { path = "../planebotcli-types" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
mockito = "1"
